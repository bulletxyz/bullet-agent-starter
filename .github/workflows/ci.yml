name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067 # v1
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo +nightly fmt --all --check

  check:
    name: Clippy, tests, config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      # The compiler and components rust-toolchain.toml pins.
      - run: rustup toolchain install
      # Dependencies first. While bullet-bots is private, with the
      # BULLET_BOTS_TOKEN secret (read access to it), in this step only:
      # `cargo fetch` runs no build scripts, and the steps below compile from
      # what it fetched without ever seeing the token.
      - name: Fetch dependencies
        env:
          TOKEN: ${{ secrets.BULLET_BOTS_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            export CARGO_NET_GIT_FETCH_WITH_CLI=true GIT_CONFIG_COUNT=1 \
              GIT_CONFIG_KEY_0="url.https://x-access-token:${TOKEN}@github.com/bulletxyz/.insteadOf" \
              GIT_CONFIG_VALUE_0="https://github.com/bulletxyz/"
          fi
          cargo fetch --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      # The config the deploy ships, checked offline the way the agent loads it.
      - name: Validate agent.toml
        env:
          BB_NETWORK: testnet
          BB_SYMBOL: BTC-USD
        run: cargo run --locked --bin bb-bot -- validate --config agent.toml
