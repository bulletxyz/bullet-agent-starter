[package]
name = "my-agent"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT-0"
publish = false
description = "My Bullet trading agent: the strategy; the framework runs everything else"

# Its own workspace, never part of another.
[workspace]

[[bin]]
name = "bb-bot"
path = "src/main.rs"

[dependencies]
# The framework. Upgrade by bumping the tag (and `cargo update -p bullet-agents`);
# bump this entry and the [dev-dependencies] one together, to the same tag.
# Never enable its `published-image` feature: hard limits come only from Fly secrets.
bullet-agents = { git = "https://github.com/bulletxyz/bullet-bots", tag = "v8" }

[dev-dependencies]
bullet-agents = { git = "https://github.com/bulletxyz/bullet-bots", tag = "v8", features = ["testing"] }

[lints.rust]
unsafe_code = "deny"
# Elided lifetimes in paths, bare trait objects: idioms the 2018 edition made standard.
rust_2018_idioms = { level = "warn", priority = -1 }
# `std::fmt::Display` when `Display` is already imported is noise.
unused_qualifications = "warn"
missing_debug_implementations = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Pedantic overrides - these are too noisy for trading code
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Reliability: no silent panics in live trading code
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Decimal and integer operators panic on overflow; live trading code must not panic.
arithmetic_side_effects = "deny"
# Debug and placeholder macros must never reach a live bot.
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
# Every #[allow]/#[expect] says why it exists.
allow_attributes_without_reason = "deny"
# Prefer #[expect]: it fails once the lint stops firing, so stale allows can't pile up.
allow_attributes = "warn"

[profile.release]
lto = "thin"
panic = "abort"
strip = true
